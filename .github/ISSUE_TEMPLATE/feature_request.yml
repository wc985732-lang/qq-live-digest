name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请注意：评论区/Issue 里的想法会先进候选池，按 `docs/ROADMAP.md` 的评分模型排期，
        **不是提了就做**。请重点说明它解决的是哪个**真实问题**。
  - type: checkboxes
    id: prep
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 与 `docs/ROADMAP.md`，没有重复
          required: true
        - label: 这个建议不属于 ROADMAP 第六节"明确暂缓 / 不做"的范围（若有异议请说明理由）
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 它解决什么问题
      description: 你遇到的真实痛点是什么？涉及成本、隐私、部署、漏报、误报、可解释性还是可替换性？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
      description: 简述方案；如果你有实现思路，欢迎一并说明。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 消息接收 / 接入
        - 过滤 / 去重 / 打分
        - LLM 摘要与模型
        - 待办 / 提醒 / 日历
        - 推送通道
        - 移动端 PWA
        - 部署 / 可靠性
        - 文档 / 社区
        - 安全
        - 其他
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 可选。
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 做到什么程度算完成？
    validations:
      required: false
